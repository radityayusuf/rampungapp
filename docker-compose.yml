services:
  db:
    image: mysql:8.4
    container_name: rampung-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rampung
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: rampung-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: "mysql://root:rootpassword@db:3306/rampung"
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://localhost,https://rampung.biz,http://rampung.biz"
      # Alamat web yang tampil di tautan email (undangan, reset sandi). Isi PUBLIC_URL di .env server.
      FRONTEND_URL: "${PUBLIC_URL:-http://localhost:3000}"
      AUTH_THROTTLE: 200
      GOOGLE_CLIENT_ID: "995698868481-o9re5ai2jm1ccnnamri95c3s68hdctmh.apps.googleusercontent.com"
      # Superadmin platform (berlaku setelah email diverifikasi lewat login Google)
      SUPERADMIN_EMAILS: "amaniaevent@gmail.com"
      # Email (SMTP) — nilainya dibaca dari berkas .env di server (tidak masuk git). Lihat .env.example.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-Rampung <no-reply@rampung.id>}"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rampung-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-uploads:
